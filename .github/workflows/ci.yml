name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Complements Dependabot: catches CVEs in what ships (runtime dependencies). Blocking.
      - run: npm audit --omit=dev --audit-level=high

      # Dev tools (vite, vitest) are not shipped, so their advisories are reported but do not block.
      # Remove continue-on-error once the upstream fix lands and this passes.
      - name: Audit dev dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
