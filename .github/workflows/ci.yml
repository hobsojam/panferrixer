name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the deploy job may publish to GitHub Pages.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Built on every run, so a PR that breaks the build fails here rather than at deploy.
      - run: npm run build

      # Complements Dependabot: catches CVEs in what ships (runtime dependencies). Blocking.
      - run: npm audit --omit=dev --audit-level=high

      # Dev tools (vite, vitest) are not shipped, so their advisories are reported but do not block.
      # Remove continue-on-error once the upstream fix lands and this passes.
      - name: Audit dev dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

      # The site is published only from main, after typecheck, tests and audit have passed.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never cancel one halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
